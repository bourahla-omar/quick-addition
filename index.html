<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Addition</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#1f2a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root { --bg:#f6f1e9; --ink:#1f2a24; --muted:#6b726c; --ok:#2e7d4f; --bad:#c0392b; --card:#fffdf8; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--ink); font-family:system-ui, sans-serif; }
  .card { background:var(--card); width:min(520px, 92vw); padding:32px 28px; border-radius:18px;
          box-shadow:0 10px 30px #0001; text-align:center; }
  h1 { margin:0 0 6px; font-size:26px; }
  h2 { margin:20px 0 4px; font-size:13px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.6px; }
  .muted { color:var(--muted); font-size:14px; }
  .bar { display:flex; justify-content:space-between; font-size:18px; margin-bottom:18px; }
  .problem { font-size:64px; font-weight:700; letter-spacing:2px; margin:18px 0; font-variant-numeric:tabular-nums; }
  .tier { font-size:13px; color:var(--muted); height:16px; }
  input { font-size:36px; width:180px; text-align:center; padding:8px; border-radius:12px;
          border:2px solid #d8d2c6; outline:none; font-variant-numeric:tabular-nums; }
  input:focus { border-color:var(--ink); }
  .flash-ok { border-color:var(--ok) !important; }
  .flash-bad { border-color:var(--bad) !important; }
  .feedback { height:24px; margin-top:10px; font-size:16px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  button { font-size:18px; padding:10px 22px; border-radius:12px; border:0; background:var(--ink);
           color:#fff; cursor:pointer; margin:6px; }
  button.ghost { background:transparent; color:var(--ink); border:2px solid var(--ink); }
  button.on { background:var(--ink); color:#fff; }
  button.small { font-size:15px; padding:8px 16px; }
  table { margin:16px auto 6px; border-collapse:collapse; font-size:15px; }
  td, th { padding:4px 12px; text-align:left; }
  th { color:var(--muted); font-weight:600; }
  td { font-variant-numeric:tabular-nums; white-space:nowrap; }
  #pbody td, #pbody th { padding:4px 8px; }
  .hidden { display:none; }
  .timebar { height:6px; background:#e8e2d6; border-radius:3px; overflow:hidden; margin-bottom:14px; }
  .timebar > div { height:100%; background:var(--ink); width:100%; transition:width .25s linear; }
  .stats { display:flex; justify-content:center; flex-wrap:wrap; gap:6px 18px; margin:8px 0; }
  .stats div { min-width:88px; }
  .stats b { display:block; font-size:24px; font-variant-numeric:tabular-nums; }
  .stats span { font-size:13px; color:var(--muted); }
  ul.pairs { list-style:none; padding:0; margin:6px 0; font-size:15px; }
  ul.pairs li { padding:3px 0; }
  ul.pairs b { font-variant-numeric:tabular-nums; margin-right:8px; }
  .pbline { font-size:13px; color:var(--muted); height:16px; margin:-10px 0 8px; }
  .pbline.ok { color:var(--ok); font-weight:600; }
  .celebrate { background:#fff3c4; border-radius:14px; padding:12px 14px; margin:6px 0 12px; font-size:16px;
               animation:pop .5s ease-out; }
  .celebrate b { display:block; font-size:22px; margin-bottom:4px; }
  .celebrate div { padding:2px 0; }
  @keyframes pop { 0% { transform:scale(.6); opacity:0 } 70% { transform:scale(1.08) } 100% { transform:scale(1); opacity:1 } }
</style>
</head>
<body>
<div class="card">
  <section id="start">
    <h1>Quick Addition</h1>
    <p class="muted">Mode:</p>
    <div>
      <button class="ghost" data-mode="mixed">Mixed</button>
      <button class="ghost" data-mode="single">Single digits</button>
    </div>
    <p class="muted" id="modeinfo"></p>
    <p class="muted" id="startpb"></p>
    <p class="muted">Time:</p>
    <div>
      <button class="ghost" data-time="30">30 s</button>
      <button data-time="60">60 s</button>
      <button class="ghost" data-time="120">2 min</button>
    </div>
    <p><button class="ghost small" id="open-progress">Progress</button></p>
  </section>

  <section id="play" class="hidden">
    <div class="timebar"><div id="timefill"></div></div>
    <div class="bar"><span>Time: <b id="time">60</b>s</span><span>Correct: <b id="score">0</b></span></div>
    <div class="pbline" id="pb"></div>
    <div class="tier" id="tier"></div>
    <div class="problem" id="problem">0 + 0</div>
    <input id="answer" inputmode="numeric" autocomplete="off" aria-label="Your answer">
    <div class="feedback" id="feedback"></div>
    <p class="muted" id="hint">Type the answer and press Enter.</p>
  </section>

  <section id="end" class="hidden">
    <h1>Time's up</h1>
    <p style="font-size:22px">You got <b id="final">0</b> right out of <b id="attempted">0</b>.</p>
    <div id="celebrate"></div>
    <p class="muted" id="endnote"></p>
    <table id="breakdown"></table>
    <button id="again">Play again</button>
    <button class="ghost" id="end-progress">Progress</button>
  </section>

  <section id="progress" class="hidden">
    <h1>Progress</h1>
    <p class="muted">Saved on this device only.</p>
    <div>
      <button class="ghost small" data-ptab="mixed">Mixed</button>
      <button class="ghost small" data-ptab="single">Single digits</button>
    </div>
    <div id="pbody"></div>
    <p style="margin-top:22px">
      <button id="back">Back</button>
      <button class="ghost small" id="reset">Reset progress</button>
    </p>
  </section>
</div>

<script>
// ---------- Problem generators ----------
// Difficulty tiers. Carrying is what makes a sum hard, so tiers go from no carry
// with small numbers up to two-digit sums that carry in both columns.
const MIXED_TIERS = [
  { name: "Easy",        gen: () => noCarry2x1() },   // 23 + 5
  { name: "Medium",      gen: () => carry1x1() },     // 8 + 7
  { name: "Medium",      gen: () => noCarry2x2() },   // 21 + 34
  { name: "Hard",        gen: () => carry2x1() },     // 27 + 8
  { name: "Hard",        gen: () => carry2x2Ones() }, // 18 + 17
  { name: "Hardest",     gen: () => carry2x2Both() }, // 58 + 67
];
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
function noCarry1x1() { const a = rnd(1, 8); return [a, rnd(1, 9 - a)]; }
function carry1x1()   { const a = rnd(2, 9); return [a, rnd(10 - a, 9)]; }
function noCarry2x1() { const t = rnd(1, 9), o = rnd(0, 8); return [10 * t + o, rnd(1, 9 - o)]; }
function carry2x1()   { const t = rnd(1, 8), o = rnd(2, 9); return [10 * t + o, rnd(10 - o, 9)]; }
function noCarry2x2() {
  const t1 = rnd(1, 8), o1 = rnd(0, 8);
  return [10 * t1 + o1, 10 * rnd(1, 9 - t1) + rnd(0, 9 - o1)];
}
function carry2x2Ones() { // ones column carries, tens column does not (sum < 100)
  const o1 = rnd(2, 9), o2 = rnd(10 - o1, 9);
  const t1 = rnd(1, 7), t2 = rnd(1, 8 - t1);
  return [10 * t1 + o1, 10 * t2 + o2];
}
function carry2x2Both() { // both columns carry: result is three digits
  const o1 = rnd(2, 9), o2 = rnd(10 - o1, 9);
  const t1 = rnd(2, 9), t2 = rnd(Math.max(1, 9 - t1), 9);
  return [10 * t1 + o1, 10 * t2 + o2];
}

// Single digits: both numbers run from 1 to 9. The tiers split on the sum,
// because carrying past 10 is what makes these hard. Every pair in a tier is
// listed, so pairs the player struggles with can be weighted (see pickPair).
function singlePairs(min, max) {
  const out = [];
  for (let a = 1; a <= 9; a++) for (let b = a; b <= 9; b++) if (a + b >= min && a + b <= max) out.push([a, b]);
  return out;
}
const SINGLE_TIERS = [
  { name: "Easy",   pairs: singlePairs(2, 9) },    // 3 + 4, no carry
  { name: "Medium", pairs: singlePairs(10, 12) },  // 4 + 7
  { name: "Hard",   pairs: singlePairs(13, 18) },  // 7 + 8
].map(t => ({ name: t.name, gen: () => pickPair(t.pairs) }));

const MODES = {
  mixed:  { name: "Mixed", tiers: MIXED_TIERS, onesOnly: false,
            info: "Answer as many as you can before time runs out. Problems rotate evenly from easy to hard. The hard ones need carrying, like 18 + 17.",
            hint: "Type the answer and press Enter." },
  single: { name: "Single digits", tiers: SINGLE_TIERS, onesOnly: true,
            info: "Two single-digit numbers, like 7 + 8. Only the last digit of your answer is checked: for 7 + 8, both 5 and 15 count. Pairs you miss or answer slowly come back more often.",
            hint: "Type the answer, or just its last digit, and press Enter." },
};

// Random draws from an even distribution over the tiers, with a soft correction:
// if the last few problems ran harder (or easier) than average, the odds lean
// back the other way, so an unlucky streak doesn't stay unlucky.
const RECENT = 5;          // how many past problems the correction looks at
const PULL = 1.2;          // how strongly it leans back (0 = pure random)
let recent = [];
function nextTier(tiers) {
  const n = tiers.length, mid = (n - 1) / 2;
  const drift = recent.length ? recent.reduce((s, t) => s + t, 0) / recent.length - mid : 0;
  const w = tiers.map((_, i) => Math.exp(-PULL * (drift / mid) * ((i - mid) / mid)));
  const t = weightedIndex(w);
  recent.push(t); if (recent.length > RECENT) recent.shift();
  return t;
}
function weightedIndex(w) {
  let r = Math.random() * w.reduce((s, x) => s + x, 0), i = 0;
  while (i < w.length - 1 && r >= w[i]) r -= w[i++];
  return i;
}

// Pairs the player has got wrong or answered slowly come up more often: the
// weight runs from 1 (fine) up to about 4 (always wrong and slow).
let lastKey = null;
function pickPair(pairs) {
  const m = modeProgress(mode);
  const w = pairs.map(p => 1 + struggle(m, pairKey(p[0], p[1])));
  let p = pairs[weightedIndex(w)];
  if (pairKey(p[0], p[1]) === lastKey) p = pairs[weightedIndex(w)]; // one re-roll, so the same pair rarely repeats
  return p;
}

// ---------- Progress, saved on this device only ----------
const STORE = "quickAddition.progress.v1";
const MAX_MS = 15000;   // slower answers count as 15 s, so a pause doesn't wreck the averages
const MIN_FOR_PB = 5;   // speed and accuracy bests need at least this many answers in the round
const pairKey = (a, b) => Math.min(a, b) + "+" + Math.max(a, b);
const lenLabel = s => s < 120 ? s + " s" : (s / 60) + " min";
const fmtS = ms => (ms / 1000).toFixed(1) + " s";
let progress = loadProgress();

function loadProgress() {
  try {
    const p = JSON.parse(localStorage.getItem(STORE));
    if (p && p.v === 1 && p.modes) {
      // bests came later: derive them from rounds saved by an older version
      Object.values(p.modes).forEach(m => {
        if (m.best) return;
        m.best = {};
        (m.sessions || []).forEach(s => updateBests(m, s.secs, s.right, s.tried, s.ms, s.at));
      });
      return p;
    }
  } catch (e) {}
  return { v: 1, modes: {} };
}
// Personal bests per round length: best score, fastest time per answer and
// best accuracy, each with the date it was set. Returns what improved.
function updateBests(m, secs, right, tried, msPer, at) {
  const cur = m.best[secs] || (m.best[secs] = {}), gained = {};
  const beat = (key, v, better) => {
    if (cur[key] && !better(v, cur[key].v)) return;
    gained[key] = { old: cur[key] ? cur[key].v : null, v };
    cur[key] = { v, at };
  };
  beat("score", right, (a, b) => a > b);
  if (tried >= MIN_FOR_PB) {
    beat("ms", Math.round(msPer), (a, b) => a < b);
    beat("acc", Math.round(100 * right / tried), (a, b) => a > b);
  }
  return gained;
}
function saveProgress() { try { localStorage.setItem(STORE, JSON.stringify(progress)); } catch (e) {} }
function modeProgress(id) {
  return progress.modes[id] || (progress.modes[id] = { answers: 0, right: 0, ms: 0, sessions: [], pairs: {}, best: {} });
}
function recordAnswer(a, b, ok, ms) {
  const m = modeProgress(mode), k = pairKey(a, b);
  const p = m.pairs[k] || (m.pairs[k] = { n: 0, w: 0, ms: 0 });
  m.answers++; m.ms += ms; p.n++; p.ms += ms;
  if (ok) m.right++; else p.w++;
  saveProgress();
}
function recordSession(tried, right, ms) {
  const m = modeProgress(mode);
  m.sessions.push({ at: Date.now(), secs: total, tried, right, ms: Math.round(ms / tried) });
  if (m.sessions.length > 100) m.sessions.shift();
  saveProgress();
}
// How much trouble a pair gives: 0 = fine, up to about 3 = always wrong and
// twice as slow as the player's average in this mode.
function struggle(m, k) {
  const p = m.pairs[k];
  if (!p) return 0;
  const wrong = p.w / (p.n + 1);
  const avg = m.answers ? m.ms / m.answers : 0;
  const slow = avg ? Math.max(0, Math.min(1, (p.ms / p.n - avg) / avg)) : 0;
  return 2 * wrong + slow;
}

// ---------- Game ----------
const $ = id => document.getElementById(id);
let mode = "mixed", total = 60, left = 60, timer = null, current = null, score = 0, stats = [];
let shownAt = 0, roundMs = 0;

function setMode(id) {
  mode = id;
  document.querySelectorAll("[data-mode]").forEach(b => b.classList.toggle("on", b.dataset.mode === id));
  $("modeinfo").textContent = MODES[id].info;
  $("hint").textContent = MODES[id].hint;
  progress.lastMode = id; saveProgress();
  renderStartPB();
}
function renderStartPB() {
  const b = modeProgress(mode).best;
  const parts = Object.keys(b).map(Number).sort((x, y) => x - y).filter(s => b[s].score).map(s => `${b[s].score.v} in ${lenLabel(s)}`);
  $("startpb").textContent = parts.length ? "\u{1F3C6} Your best: " + parts.join(" \u00b7 ") : "No personal best yet. Play a round to set one!";
}
// During a round: the personal best for this length, and the score the
// player is on track for at the current pace.
function updatePace() {
  const pb = (modeProgress(mode).best[total] || {}).score, el = $("pb");
  if (!pb) { el.textContent = ""; el.className = "pbline"; return; }
  const elapsed = total - left;
  let text = `\u{1F3C6} PB ${pb.v}`, ahead = false;
  if (elapsed >= 5 && score > 0) { const pace = Math.round(score * total / elapsed); text += ` \u00b7 on track for ${pace}`; ahead = pace > pb.v; }
  if (score > pb.v) { text = `\u{1F3C6} New PB! ${score}`; ahead = true; }
  el.textContent = text; el.className = "pbline" + (ahead ? " ok" : "");
}

function newProblem() {
  const tiers = MODES[mode].tiers, t = nextTier(tiers);
  let [a, b] = tiers[t].gen();
  if (Math.random() < 0.5) [a, b] = [b, a];
  current = { a, b, t }; lastKey = pairKey(a, b);
  $("problem").textContent = `${a} + ${b}`;
  $("tier").textContent = tiers[t].name;
  $("answer").value = "";
  $("answer").focus();
  shownAt = performance.now();
}

function start(seconds) {
  total = left = seconds; score = 0; recent = []; roundMs = 0; lastKey = null;
  stats = MODES[mode].tiers.map(() => ({ right: 0, tried: 0 }));
  $("score").textContent = 0; $("time").textContent = left; $("feedback").textContent = "";
  $("timefill").style.width = "100%";
  show("play"); newProblem(); updatePace();
  clearInterval(timer);
  timer = setInterval(() => {
    left--; $("time").textContent = left;
    $("timefill").style.width = (100 * left / total) + "%";
    if (left <= 0) finish(); else updatePace();
  }, 1000);
}

function submit() {
  const raw = $("answer").value.trim();
  if (raw === "" || !current) return;
  const sum = current.a + current.b, given = Number(raw);
  // Single digits mode only checks the ones digit, so 5 and 15 both count for 7 + 8.
  const ok = MODES[mode].onesOnly ? given % 10 === sum % 10 : given === sum;
  const ms = Math.min(MAX_MS, performance.now() - shownAt);
  const s = stats[current.t]; s.tried++; roundMs += ms;
  recordAnswer(current.a, current.b, ok, ms);
  const input = $("answer");
  input.classList.remove("flash-ok", "flash-bad");
  const full = `${current.a} + ${current.b} = ${sum}`;
  if (ok) {
    score++; s.right++; $("score").textContent = score; input.classList.add("flash-ok");
    // the full answer is always shown in single digits mode, even after a short answer
    $("feedback").innerHTML = MODES[mode].onesOnly ? `<span class="ok">${full}</span>` : "";
  } else {
    $("feedback").innerHTML = `<span class="bad">${full}</span>`; input.classList.add("flash-bad");
  }
  setTimeout(() => input.classList.remove("flash-ok", "flash-bad"), 250);
  newProblem(); updatePace();
}

function finish() {
  clearInterval(timer); current = null;
  const tiers = MODES[mode].tiers;
  const tried = stats.reduce((n, s) => n + s.tried, 0);
  $("final").textContent = score; $("attempted").textContent = tried;
  let note = "", box = "";
  if (tried) {
    const m = modeProgress(mode), msPer = roundMs / tried;
    const gained = updateBests(m, total, score, tried, msPer, Date.now());
    recordSession(tried, score, roundMs);
    note = `${MODES[mode].name}, ${lenLabel(total)}: ${fmtS(msPer)} per answer, ${Math.round(100 * score / tried)}% right.`;
    const was = (g, f) => g.old === null ? "" : ` (was ${f(g.old)})`;
    const lines = [];
    if (gained.score) lines.push(`<b>\u{1F3C6} New personal best!</b>` + (gained.score.old === null ? `Your first score: ${score}` : `Was ${gained.score.old}, now ${score}`));
    if (gained.ms) lines.push(`\u26A1 Fastest yet: ${fmtS(gained.ms.v)} per answer${was(gained.ms, fmtS)}`);
    if (gained.acc) lines.push(`\u{1F3AF} Best accuracy: ${gained.acc.v}%${was(gained.acc, v => v + "%")}`);
    if (lines.length) box = `<div class="celebrate">${lines.map(l => `<div>${l}</div>`).join("")}</div>`;
    else note += ` Personal best: ${m.best[total].score.v}.`;
  }
  $("celebrate").innerHTML = box;
  $("endnote").textContent = note;
  // merge tiers that share a label for the summary
  const by = {};
  tiers.forEach((t, i) => { by[t.name] = by[t.name] || { right: 0, tried: 0 }; by[t.name].right += stats[i].right; by[t.name].tried += stats[i].tried; });
  $("breakdown").innerHTML = "<tr><th>Level</th><th>Right</th><th>Tried</th></tr>" +
    Object.entries(by).map(([k, v]) => `<tr><td>${k}</td><td>${v.right}</td><td>${v.tried}</td></tr>`).join("");
  show("end");
}

// ---------- Progress view ----------
let ptab = "mixed";
function renderProgress(id) {
  ptab = id;
  document.querySelectorAll("[data-ptab]").forEach(b => b.classList.toggle("on", b.dataset.ptab === id));
  const m = progress.modes[id];
  if (!m || !m.answers) { $("pbody").innerHTML = `<p class="muted">No ${MODES[id].name} rounds played yet.</p>`; return; }
  const secs = fmtS;
  const S = m.sessions, avgOf = list => list.length ? list.reduce((s, x) => s + x.ms, 0) / list.length : 0;
  let speed = `<p class="muted">Speed: ${secs(m.ms / m.answers)} per answer overall.`;
  if (S.length >= 6) speed += ` Last three rounds ${secs(avgOf(S.slice(-3)))}, first three rounds ${secs(avgOf(S.slice(0, 3)))}.`;
  speed += "</p>";
  const rounds = S.slice(-10).reverse().map(s =>
    `<tr><td>${new Date(s.at).toLocaleDateString(undefined, { month: "short", day: "numeric" })}<br>` +
    `<span class="muted">${new Date(s.at).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })}</span></td>` +
    `<td>${s.secs} s</td><td>${s.right} / ${s.tried}</td><td>${secs(s.ms)}</td></tr>`).join("");
  const hard = Object.keys(m.pairs).filter(k => m.pairs[k].n >= 2 && struggle(m, k) > 0.25)
    .sort((x, y) => struggle(m, y) - struggle(m, x)).slice(0, 8);
  const pairs = hard.length ? "<ul class=\"pairs\">" + hard.map(k => {
    const p = m.pairs[k];
    return `<li><b>${k.replace("+", " + ")}</b><span class="muted">wrong ${p.w} of ${p.n}, ${secs(p.ms / p.n)}</span></li>`;
  }).join("") + "</ul>" : "<p class=\"muted\">Nothing stands out yet. Keep playing.</p>";
  const B = m.best || {}, lens = Object.keys(B).map(Number).sort((x, y) => x - y).filter(s => B[s].score);
  const date = at => new Date(at).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  const cell = (b, f) => b ? `${f(b.v)}<br><span class="muted">${date(b.at)}</span>` : "-";
  const bests = lens.length ? "<table><tr><th>Length</th><th>Score</th><th>Fastest</th><th>Accuracy</th></tr>" + lens.map(s =>
    `<tr><td>${lenLabel(s)}</td><td>${cell(B[s].score, v => v)}</td><td>${cell(B[s].ms, fmtS)}</td><td>${cell(B[s].acc, v => v + "%")}</td></tr>`).join("") + "</table>"
    : "<p class=\"muted\">None yet.</p>";
  $("pbody").innerHTML =
    `<div class="stats">
       <div><b>${m.answers}</b><span>answers</span></div>
       <div><b>${Math.round(100 * m.right / m.answers)}%</b><span>accuracy</span></div>
       <div><b>${secs(m.ms / m.answers)}</b><span>per answer</span></div>
       <div><b>${S.length}</b><span>rounds</span></div>
     </div>` + speed +
    "<h2>\u{1F3C6} Personal bests</h2>" + bests +
    "<h2>Recent rounds</h2><table><tr><th>When</th><th>Length</th><th>Right</th><th>Speed</th></tr>" + rounds + "</table>" +
    "<h2>Needs work</h2>" + pairs +
    (id === "single" && hard.length ? "<p class=\"muted\">These come up more often in Single digits.</p>" : "");
}
function openProgress() { renderProgress(mode); show("progress"); }

function show(id) {
  ["start", "play", "end", "progress"].forEach(s => $(s).classList.toggle("hidden", s !== id));
  if (id === "start") renderStartPB();
}

document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => setMode(b.dataset.mode));
document.querySelectorAll("[data-time]").forEach(b => b.onclick = () => start(Number(b.dataset.time)));
document.querySelectorAll("[data-ptab]").forEach(b => b.onclick = () => renderProgress(b.dataset.ptab));
$("open-progress").onclick = openProgress;
$("end-progress").onclick = openProgress;
$("again").onclick = () => show("start");
$("back").onclick = () => show("start");
$("reset").onclick = () => {
  if (!confirm("Delete all saved progress on this device?")) return;
  progress = { v: 1, modes: {}, lastMode: mode }; saveProgress(); renderProgress(ptab);
};
$("answer").addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
setMode(MODES[progress.lastMode] ? progress.lastMode : "mixed");
</script>
</body>
</html>
